name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Required for Sigstore Cosign OIDC keyless signing

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Install Linux Sandbox Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Verify Unit Tests
        run: go test -v ./...

      - name: Build & Package Binaries
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo "dev")"
          fi
          make package VERSION="$VERSION"

      - name: Sign Release Checksums with Cosign (Keyless OIDC)
        run: |
          echo "==> Signing checksums.txt with Sigstore Cosign (Keyless OIDC)..."
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.bundle
          generate_release_notes: true
          draft: false
          prerelease: false
